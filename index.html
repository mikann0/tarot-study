<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>タロット学習帳</title>
<meta name="theme-color" content="#3d3a8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="padding-block:0">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15.5 3.5a8.5 8.5 0 1 0 5 15.2A7 7 0 0 1 15.5 3.5z"/><path d="M18.5 4l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="currentColor" stroke="none"/></svg><span id="appName">タロット学習帳</span></div>
    <div class="toprow">
      <select class="lang" id="langSel" aria-label="Language">
        <option value="ja">日本語</option><option value="en">English</option><option value="fr">Français</option>
      </select>
      <button class="btn small" id="openDict" type="button">カード辞典</button>
    </div>
  </header>
</div>
<nav class="tabs" id="tabs"><div class="in" role="tablist">
  <button role="tab" data-view="learn" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg><span data-t="tabLearn"></span></button>
  <button role="tab" data-view="read" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="6" width="8" height="13" rx="1.5"/><rect x="13" y="4" width="8" height="13" rx="1.5" transform="rotate(8 17 10)"/></svg><span data-t="tabRead"></span></button>
  <button role="tab" data-view="ref" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><span data-t="tabRef"></span></button>
  <button role="tab" data-view="log" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3h10l3 3v15H6z"/><path d="M9 10h7M9 14h7M9 18h4"/></svg><span data-t="tabLog"></span></button>
</div></nav>
<div class="wrap" style="padding-top:0">
  <main id="main"></main>
</div>
<div class="sheet" id="sheet" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetBox"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="cards.js"></script>
<script src="data-en.js"></script>
<script src="data-fr.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
